# ShiftFlow reconstruido sobre SDAF.
# Pack .NET activo; importación de producto desde ShiftFlow-sdaf-extract (fase siguiente).

sdaf:
  version: "0.4.0"

project:
  name: ShiftFlow
  language: es

stack:
  pack: sdaf-stack-dotnet@0.3.0
  src_path: src
  tests_path: tests

agents:
  active:
    - specification
    - architecture
    - domain-application
    - frontend
    - testing-review
  stubs:
    - product
    - domain
    - application
    - infrastructure
    - devops
    - review
    - testing
    - ai
  fusions:
    testing-review: [testing, review]
    domain-application: [domain, application]

tooling:
  gentle_ai: "520ed86e8c598b01f439e28c34d391cd6f1744e3"   # main tras retirar SDD (ADR-004 de sdaf-core; docs/integracion-gentle-ai.md)
